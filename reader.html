<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Room | Wnovels Premium</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5500">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        :root { 
            --read-bg: #08080c; 
            --read-card: #0f0f18; 
            --brand-primary: #ff5500; 
            --text-main: #f1f1f6; 
            --text-muted: #8e8e9f; 
            --border-line: #1c1c30; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--read-bg); color: var(--text-main); display: flex; flex-direction: column; align-items: center; }
        .read-nav-header { width: 100%; max-width: 800px; padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-line); position: sticky; top: 0; background: var(--read-bg); z-index: 10; }
        .btn-back-node { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 600; }
        
        /* Premium Ad Spaces Layout */
        .adsterra-container-slot { width: 100%; max-width: 728px; min-height: 90px; background-color: var(--read-card); border: 1px dashed var(--border-line); margin: 20px 0; display: flex; justify-content: center; align-items: center; border-radius: 12px; overflow: hidden; }
        
        .story-viewport-canvas { width: 100%; max-width: 800px; padding: 30px 20px; }
        .story-header-block { border-bottom: 1px solid var(--border-line); padding-bottom: 25px; }
        .story-genre-badge { font-size: 11px; font-weight: 700; color: var(--brand-primary); text-transform: uppercase; }
        .story-main-title { font-size: 28px; font-weight: 800; margin-top: 5px; }
        .interaction-heart-bar { display: flex; align-items: center; gap: 20px; margin-top: 20px; }
        .btn-heart-action { background-color: var(--read-card); border: 1px solid var(--border-line); color: white; padding: 10px 20px; border-radius: 30px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-heart-action.liked { border-color: #ff3366; color: #ff3366; }
        .story-body-prose { font-family: 'Lora', serif; font-size: 19px; line-height: 1.8; text-align: justify; white-space: pre-wrap; margin-top: 25px; }
        .system-message-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-muted); gap: 10px; }
    </style>
</head>
<body>
    <header class="read-nav-header">
        <button class="btn-back-node" onclick="window.location.href='index.html'"><span class="material-icons-round">arrow_back</span>Back</button>
        <div id="navNovelTitle" style="font-weight:700;">Loading Universe...</div>
        <div style="width:40px;"></div>
    </header>

    <div class="adsterra-container-slot">
        <script async="async" data-cfasync="false" src="https://pl29471257.effectivecpmnetwork.com/4cf7e0a66c311471132f6ac2b1acd8b0/invoke.js"></script>
        <div id="container-4cf7e0a66c311471132f6ac2b1acd8b0"></div>
    </div>

    <main class="story-viewport-canvas" id="mainReadingViewport">
        <div class="system-message-box" id="coreLoadingSignal"><span class="material-icons-round">sync</span><div>Syncing database stream...</div></div>
        <div id="storyContentPacket" style="display: none;">
            <div class="story-header-block">
                <div class="story-genre-badge" id="storyGenre">Genre</div>
                <h1 class="story-main-title" id="storyTitle">Title</h1>
                <div class="interaction-heart-bar">
                    <button class="btn-heart-action" id="likeActionBtn" onclick="toggleNovelHeartReaction()"><span class="material-icons-round" id="heartIcon">favorite_border</span><span id="labelHeartCount">0</span> Likes</button>
                    <div style="font-size:13px; color:var(--text-muted);"><span id="labelViewCount">0</span> Reads</div>
                </div>
            </div>
            <article class="story-body-prose" id="storyMainBodyLines">Content</article>
        </div>
     </main>
  <div class="adsterra-container-slot" style="margin-bottom:60px;">
        <script src="https://pl29471258.effectivecpmnetwork.com/27/7b/f8/277bf845b91c531ad9fb066482ac8cae.js"></script>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBelCPgA4ZE7pcFGPPp9191KPOdaSSoMc8",
            authDomain: "studio-8164628274-c414a.firebaseapp.com",
            databaseURL: "https://studio-8164628274-c414a-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "studio-8164628274-c414a",
            storageBucket: "studio-8164628274-c414a.firebasestorage.app",
            messagingSenderId: "327634019544",
            appId: "1:327634019544:web:e3e913c4f12ea1d54ce3ad"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const URL_PARAM_ID = new URLSearchParams(window.location.search).get('id');
        let currentNovelRef = db.ref('novels/' + URL_PARAM_ID);
        let userHasLiked = false;

        if (URL_PARAM_ID) {
            currentNovelRef.on('value', snap => {
                if(snap.exists()){
                    const data = snap.val();
                    document.getElementById('coreLoadingSignal').style.display = 'none';
                    document.getElementById('storyContentPacket').style.display = 'block';
                    document.getElementById('navNovelTitle').innerText = data.title;
                    document.getElementById('storyGenre').innerText = data.genre;
                    document.getElementById('storyTitle').innerText = data.title;
                    document.getElementById('storyMainBodyLines').innerText = data.content || data.synopsis;
                    document.getElementById('labelHeartCount').innerText = data.likes || 0;
                    document.getElementById('labelViewCount').innerText = data.views || 0;
                } else {
                    document.getElementById('coreLoadingSignal').innerHTML = `
                        <div style="text-align:center; padding: 20px;">
                            <span class="material-icons-round" style="font-size:48px; color:var(--brand-primary)">warning</span>
                            <h3 style="margin-top:10px;">System Parameter Error</h3>
                            <p style="font-size:13px; color:var(--text-muted); margin-top:5px;">No novel profile detected in this directory node.</p>
                            <button onclick="window.location.href='index.html'" style="margin-top:15px; background:var(--brand-primary); border:none; padding:10px 20px; color:white; border-radius:8px; font-weight:700; cursor:pointer;">Return to Grid</button>
                        </div>`;
                }
            });
            executeAntiCheatViewAlgorithm();
        } else {
            document.getElementById('coreLoadingSignal').innerHTML = `
                <div style="text-align:center; padding: 20px;">
                    <span class="material-icons-round" style="font-size:48px; color:var(--brand-primary)">security</span>
                    <h3 style="margin-top:10px;">System Parameter Error</h3>
                    <p style="font-size:13px; color:var(--text-muted); margin-top:5px;">No novel selected inside core system parameters.</p>
                    <button onclick="window.location.href='index.html'" style="margin-top:15px; background:var(--brand-primary); border:none; padding:10px 20px; color:white; border-radius:8px; font-weight:700; cursor:pointer;">Return to Grid</button>
                </div>`;
        }

        function executeAntiCheatViewAlgorithm() {
            const lockKey = 'view_lock_' + URL_PARAM_ID;
            const lastView = localStorage.getItem(lockKey);
            const now = Date.now();
            if (!lastView || (now - lastView > 600000)) {
                currentNovelRef.child('views').transaction(v => (v || 0) + 1);
                localStorage.setItem(lockKey, now);
            }
        }

        function toggleNovelHeartReaction() {
            const btn = document.getElementById('likeActionBtn');
            const icon = document.getElementById('heartIcon');
            if(!userHasLiked) {
                currentNovelRef.child('likes').transaction(l => (l || 0) + 1);
                btn.classList.add('liked'); icon.innerText = "favorite"; userHasLiked = true;
            } else {
                currentNovelRef.child('likes').transaction(l => (l > 0 ? l - 1 : 0));
                btn.classList.remove('liked'); icon.innerText = "favorite_border"; userHasLiked = false;
            }
        }
    </script>
</body>
</html>
