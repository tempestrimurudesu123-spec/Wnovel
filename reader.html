aiwjwkwklqlayukkiil            </div>
        </section>

        <section class="community-comment-module">
            <div class="comment-module-title">
                <span class="material-icons-round">forum</span>Community Discussion Hub
            </div>

            <div class="comment-input-block">
                <input type="text" id="userCommentInputField" class="comment-field-node" placeholder="Write an open comment or analysis thought node...">
                <button class="comment-submit-btn" onclick="dispatchUserCommentToDatabase()">
                    <span class="material-icons-round">send</span>
                </button>
            </div>

            <div class="comments-feed-horizon" id="globalCommentsFeedOutputArea">
                <div class="empty-feed-fallback">Syncing comment nodes feed cluster...</div>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBelCPgA4ZE7pcFGPPp9191KPOdaSSoMc8",
            authDomain: "studio-8164628274-c414a.firebaseapp.com",
            databaseURL: "https://studio-8164628274-c414a-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "studio-8164628274-c414a",
            storageBucket: "studio-8164628274-c414a.firebasestorage.app",
            messagingSenderId: "327634019544",
            appId: "1:327634019544:web:e3e913c4f12ea1d54ce3ad"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Parse Targeted Book Matrix Key From URL Address Bar Parameter
        const urlAddressParameters = new URLSearchParams(window.location.search);
        const targetedNovelDatabaseKey = urlAddressParameters.get('id');

        let activeAuthorizedUserSession = null;
        let currentUserProfileNode = null;
        let localUserHasLikedThisBookNode = false;

        // Listen for Realtime User Login Configuration
        auth.onAuthStateChanged(user => {
            if (user) {
                activeAuthorizedUserSession = user;
                db.ref('users/' + user.uid).once('value', snapshot => {
                    if (snapshot.exists()) {
                        currentUserProfileNode = snapshot.val();
                        document.getElementById('pwaAuthSyncStatus').innerText = "@" + currentUserProfileNode.username;
                        document.getElementById('pwaAuthSyncStatus').style.color = "var(--brand-core)";
                    }
                });
                checkIfUserHasAlreadyLikedTargetNovel();
            } else {
                document.getElementById('pwaAuthSyncStatus').innerText = "Guest Reader Node";
            }
        });

        if (!targetedNovelDatabaseKey) {
            alert("No data retrieval routing parameters defined. Returning to Mainframe Grid.");
            window.location.href = "index.html";
        } else {
            initializeReaderInterfaceStream();
            streamLiveDatabaseCommentsFeed();
        }

        // Initialize Core Story Data & Increment View Count Automatically
        function initializeReaderInterfaceStream() {
            const novelDataRef = db.ref('novels/' + targetedNovelDatabaseKey);
            
            // Execute automated single view counter step
            novelDataRef.child('views').transaction(currentValue => {
                return (currentValue || 0) + 1;
            });

            // Sync structural text nodes onto the front-end layout elements
            novelDataRef.on('value', snapshot => {
                if (!snapshot.exists()) {
                    alert("Requested story manuscript entry has been purged or moved.");
                    window.location.href = "index.html";
                    return;
                }

                const book = snapshot.val();
                document.getElementById('readNovelGenreTag').innerText = book.genre || 'General';
                document.getElementById('readNovelTitleField').innerText = book.title;
                document.getElementById('readNovelAuthorNameField').innerText = "Written by " + (book.authorName || "Anonymous Creator") + " (@" + (book.authorUsername || "writer") + ")";
                document.getElementById('readNovelProseBodyField').innerText = book.content;
                document.getElementById('viewStatsCountLabel').innerText = ((book.views || 0)).toLocaleString() + " Reads";
                document.getElementById('likeButtonCountLabel').innerText = ((book.likes || 0)).toLocaleString() + " Likes";
            });
        }

        // Realtime Like/Heart Calculation Pipeline
        function checkIfUserHasAlreadyLikedTargetNovel() {
            if(!activeAuthorizedUserSession) return;
            db.ref('likes/' + targetedNovelDatabaseKey + '/' + activeAuthorizedUserSession.uid).on('value', snapshot => {
                const btn = document.getElementById('likeButtonToggleNode');
                const icon = btn.querySelector('.material-icons-round');
                if(snapshot.exists()) {
                    localUserHasLikedThisBookNode = true;
                    btn.classList.add('liked');
                    icon.innerText = "favorite";
                } else {
                    localUserHasLikedThisBookNode = false;
                    btn.classList.remove('liked');
                    icon.innerText = "favorite_border";
                }
            });
        }

        function executeLikeMetricsActionToggle() {
            if (!activeAuthorizedUserSession) {
                alert("Authentication Required. Please enter the Studio Workbench Gateway to engage with community nodes.");
                window.location.href = "login.html";
                return;
            }

            const novelRef = db.ref('novels/' + targetedNovelDatabaseKey);
            const userLikeNodeRef = db.ref('likes/' + targetedNovelDatabaseKey + '/' + activeAuthorizedUserSession.uid);

            if (localUserHasLikedThisBookNode) {
                // Unlike sequence
                userLikeNodeRef.remove().then(() => {
                    novelRef.child('likes').transaction(current => (current || 1) - 1);
                });
            } else {
                // Like sequence
                userLikeNodeRef.set(true).then(() => {
                    novelRef.child('likes').transaction(current => (current || 0) + 1);
                });
            }
        }

        // Dispatch Comments Straight to Firebase Database
        function dispatchUserCommentToDatabase() {
            if (!activeAuthorizedUserSession || !currentUserProfileNode) {
                alert("Authentication Required. Sign in to join the conversation.");
                window.location.href = "login.html";
                return;
            }

            const commentInput = document.getElementById('userCommentInputField');
            const prosePayloadString = commentInput.value.trim();

            if (!prosePayloadString) return;

            const targetCommentRef = db.ref('comments/' + targetedNovelDatabaseKey).push();
            targetCommentRef.set({
                uid: activeAuthorizedUserSession.uid,
                username: currentUserProfileNode.username || "reader",
                profilePicture: currentUserProfileNode.profilePicture || "https://api.dicebear.com/7.x/bottts/svg?seed=reader",
                commentText: prosePayloadString,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                commentInput.value = "";
            }).catch(error => alert(error.message));
        }

        // Live Real-Time Thread Streaming Script
        function streamLiveDatabaseCommentsFeed() {
            db.ref('comments/' + targetedNovelDatabaseKey).orderByChild('timestamp').on('value', snapshot => {
                const feedContainer = document.getElementById('globalCommentsFeedOutputArea');
                feedContainer.innerHTML = "";

                if (!snapshot.exists()) {
                    feedContainer.innerHTML = `<div class="empty-feed-fallback">No analysis logs declared yet. Be the first to start a discussion thread node!</div>`;
                    return;
                }

                snapshot.forEach(child => {
                    const comment = child.val();
                    const formattedDateString = comment.timestamp ? new Date(comment.timestamp).toLocaleDateString(undefined, {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'}) : "Just now";
                    
                    const card = `
                        <div class="user-comment-card">
                            <img class="commenter-avatar" src="${comment.profilePicture}" alt="user avatar">
                            <div class="comment-content-frame">
                                <div class="commenter-meta-row">
                                    <div class="commenter-username">@${comment.username}</div>
                                    <div class="comment-timestamp">${formattedDateString}</div>
                                </div>
                                <p class="comment-prose-payload">${escapeHtmlProseStrings(comment.commentText)}</p>
                            </div>
                        </div>
                    `;
                    feedContainer.insertAdjacentHTML('afterbegin', card);
                });
            });
        }

        function escapeHtmlProseStrings(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
