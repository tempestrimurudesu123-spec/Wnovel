<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wnovel | Create & Discover</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root { --p: #6366f1; --bg: #f8fafc; --c: #ffffff; --t: #0f172a; --m: #64748b; --b: #e2e8f0; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); color: var(--t); 
            min-height: 100vh; display: block; overflow-x: hidden;
        }

        /* HEADER */
        header { 
            height: 70px; background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(10px); padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--b); position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-weight: 800; font-size: 24px; color: var(--p); letter-spacing: -1px; }

        /* MAIN CONTENT */
        .container { 
            padding: 20px; padding-bottom: 120px; 
            max-width: 600px; margin: 0 auto;
        }
        .page { display: none; min-height: 60vh; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI CARDS */
        .card { 
            background: var(--c); border: 1px solid var(--b); 
            padding: 20px; border-radius: 24px; margin-bottom: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .story-title { font-size: 1.2rem; font-weight: 800; margin: 0 0 5px 0; display: block; color: var(--t); }
        .story-meta { font-size: 12px; color: var(--m); font-weight: 600; }

        /* FORMS */
        input, textarea { 
            width: 100%; padding: 16px; margin-bottom: 12px; 
            border: 1.5px solid var(--b); border-radius: 16px; font-size: 16px; 
            background: #fff; outline: none; font-family: inherit; transition: 0.2s;
        }
        input:focus { border-color: var(--p); }

        .btn { 
            background: var(--p); color: white; border: none; padding: 18px; 
            width: 100%; border-radius: 16px; font-weight: 800; font-size: 16px; 
            cursor: pointer; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }
        .btn-sec { background: transparent; color: var(--p); border: 2px solid var(--p); margin-top: 10px; box-shadow: none; }

        /* FLOATING NAVIGATION (TOUCH FIXED) */
        nav { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 75px; 
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            border-radius: 25px; display: flex; z-index: 9999; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); padding: 0 10px;
        }
        .nav-item { 
            flex: 1; background: none; border: none; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            font-size: 10px; font-weight: 700; color: #94a3b8; cursor: pointer;
        }
        .nav-item.active { color: #fff; }
        .nav-item i { font-style: normal; font-size: 22px; margin-bottom: 2px; }

        /* PRO READER */
        #reader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 10000; display: none; flex-direction: column; 
        }
        .reader-nav { padding: 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
        .reader-content { 
            flex: 1; overflow-y: auto; padding: 30px 20px; 
            font-family: 'Lora', serif; font-size: 1.25rem; line-height: 1.9; color: #334155; 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Wnovel</div>
        <div style="font-size: 11px; font-weight: 800; color: #10b981;">● ONLINE</div>
    </header>

    <div class="container">
        <div id="p-home" class="page active">
            <h2 style="font-weight: 800;">Discovery</h2>
            <div id="feed"><div class="card">Getting stories...</div></div>
        </div>

        <div id="p-lib" class="page">
            <h2 style="font-weight: 800;">Library</h2>
            <div class="card">
                <p style="color: var(--m);">Stories you read will appear here.</p>
            </div>
        </div>

        <div id="p-write" class="page">
            <h2 style="font-weight: 800;">Writer Studio</h2>
            <div id="writer-ui">
                <div class="card" style="text-align: center;">
                    <p><b>Become an Author</b><br>Login to start writing your novel.</p>
                    <button class="btn" onclick="go('prof')">Login to Studio</button>
                </div>
            </div>
        </div>

        <div id="p-prof" class="page">
            <h2 style="font-weight: 800;">Profile</h2>
            <div id="auth-ui" class="card">
                <input type="email" id="email" placeholder="Email Address">
                <input type="password" id="pass" placeholder="Password">
                <button class="btn" onclick="auth('login')">Sign In</button>
                <button class="btn btn-sec" onclick="auth('signup')">Create Author Account</button>
            </div>
            <div id="user-ui" style="display:none">
                <div class="card">
                    <p style="margin:0; font-size: 12px; color: var(--m);">Signed in as</p>
                    <p id="u-email" style="font-weight:800; margin: 5px 0 15px 0;"></p>
                    <button class="btn" style="background:#ef4444;" onclick="logout()">Sign Out</button>
                </div>
            </div>
        </div>
    </div>

    <nav>
        <button class="nav-item active" id="n-home" onclick="go('home')"><i>🏠</i>HOME</button>
        <button class="nav-item" id="n-lib" onclick="go('lib')"><i>📚</i>LIBRARY</button>
        <button class="nav-item" id="n-write" onclick="go('write')"><i>✍️</i>WRITE</button>
        <button class="nav-item" id="n-prof" onclick="go('prof')"><i>👤</i>PROFILE</button>
    </nav>

    <div id="reader">
        <div class="reader-nav">
            <button onclick="closeReader()" style="border:none; background:none; font-weight:800; font-size:16px; cursor:pointer;">✕ CLOSE</button>
            <span style="font-size: 12px; font-weight: 800; opacity: 0.5;">WNOVEL READER</span>
            <div style="width:50px"></div>
        </div>
        <div class="reader-content">
            <h1 id="r-title" style="font-family: 'Plus Jakarta Sans'; font-weight: 800; margin-top: 0;"></h1>
            <div id="r-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = 'https://brsjluzuqfhslhszxtjh.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyc2psdXp1cWZoc2xoc3p4dGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NjA5NTgsImV4cCI6MjA5NDEzNjk1OH0.Oxsyga8BnkZv54BSsUOzYLiFOcNVxpFaKLwrHVRqunk';
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);
        let me = null;

        // NAVIGATION LOGIC
        function go(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('n-' + id).classList.add('active');
            if(id === 'home') loadFeed();
        }

        async function init() {
            const { data } = await supabase.auth.getUser();
            if(data.user) {
                me = data.user;
                document.getElementById('auth-ui').style.display = 'none';
                document.getElementById('user-ui').style.display = 'block';
                document.getElementById('u-email').innerText = me.email;
                setupWriter();
            }
            loadFeed();
        }

        async function loadFeed() {
            const { data, error } = await supabase.from('stories').select('*').order('created_at', {ascending:false});
            const feed = document.getElementById('feed');
            if(error || !data || data.length === 0) {
                feed.innerHTML = '<div class="card">No stories found. Start the journey!</div>';
                return;
            }
            feed.innerHTML = "";
            data.forEach(s => {
                const c = document.createElement('div');
                c.className = 'card';
                c.innerHTML = `<span class="story-title">${s.title}</span><span class="story-meta">TAP TO READ →</span>`;
                c.onclick = () => {
                    document.getElementById('r-title').innerText = s.title;
                    document.getElementById('r-body').innerHTML = s.body.replace(/\n/g, '<br><br>');
                    document.getElementById('reader').style.display = 'flex';
                };
                feed.appendChild(c);
            });
        }

        function closeReader() { document.getElementById('reader').style.display = 'none'; }

        function setupWriter() {
            document.getElementById('writer-ui').innerHTML = `
                <div class="card">
                    <input id="w-t" placeholder="Title of your Book">
                    <textarea id="w-b" rows="12" placeholder="Start writing your story here..."></textarea>
                    <button class="btn" onclick="publish()">Publish Book</button>
                </div>`;
        }

        async function auth(type) {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            if(!e || !p) return alert("Enter credentials");
            const { error } = (type === 'login') ? await supabase.auth.signInWithPassword({email:e, password:p}) : await supabase.auth.signUp({email:e, password:p});
            if(error) alert(error.message); else location.reload();
        }

        async function publish() {
            const t = document.getElementById('w-t').value, b = document.getElementById('w-b').value;
            if(!t || !b) return alert("Fill in the fields!");
            const { error } = await supabase.from('stories').insert([{title:t, body:b, author_id:me.id}]);
            if(error) alert(error.message); else { alert("Story Published!"); go('home'); }
        }

        async function logout() { await supabase.auth.signOut(); location.reload(); }

        init();
    </script>
</body>
                        </html>
