<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wnovel | Global Stories</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Lora:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --p: #6366f1; --bg: #ffffff; --card: #f8fafc; --t: #0f172a; --m: #64748b; --b: #e2e8f0; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); color: var(--t); 
            line-height: 1.6;
        }

        /* STANDARD WEBSITE NAVIGATION (TOP) */
        nav { 
            background: #fff; 
            border-bottom: 1px solid var(--b);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-weight: 800; font-size: 22px; color: var(--p); text-decoration: none; }

        .nav-links { display: flex; gap: 20px; }
        .nav-links button { 
            background: none; border: none; font-weight: 700; color: var(--m); 
            cursor: pointer; font-size: 14px; font-family: inherit;
        }
        .nav-links button.active { color: var(--p); }

        /* MAIN CONTENT AREA */
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px 20px;
            min-height: 80vh;
        }

        .page { display: none; }
        .page.active { display: block; }

        /* CONTENT CARDS */
        .card { 
            background: var(--card); border: 1px solid var(--b); 
            padding: 25px; border-radius: 16px; margin-bottom: 20px; 
        }

        h1, h2 { font-weight: 800; letter-spacing: -1px; }

        /* FORMS */
        input, textarea { 
            width: 100%; padding: 15px; margin-bottom: 15px; 
            border: 1px solid var(--b); border-radius: 12px; font-size: 16px; 
            background: #fff; outline: none; font-family: inherit;
        }

        .btn { 
            background: var(--p); color: white; border: none; padding: 16px 25px; 
            border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer;
            width: 100%;
        }

        /* READER VIEW (STAYS ON TOP WHEN OPEN) */
        #reader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 2000; display: none; flex-direction: column; 
        }
        .reader-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        .reader-content { flex: 1; overflow-y: auto; padding: 40px 20px; font-family: 'Lora', serif; font-size: 1.3rem; line-height: 2; }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 600px) {
            .nav-links { gap: 15px; }
            .nav-links button { font-size: 12px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo" onclick="go('home')">Wnovel</a>
        <div class="nav-links">
            <button id="n-home" class="active" onclick="go('home')">Home</button>
            <button id="n-write" onclick="go('write')">Write</button>
            <button id="n-prof" onclick="go('prof')">Profile</button>
        </div>
    </nav>

    <div class="container">
        <div id="p-home" class="page active">
            <h1>Discovery</h1>
            <p style="color: var(--m)">Read the latest novels from around the world.</p>
            <hr style="border: 0; border-top: 1px solid var(--b); margin: 30px 0;">
            <div id="feed">Loading stories...</div>
        </div>

        <div id="p-write" class="page">
            <h1>Writer Studio</h1>
            <div id="writer-ui">
                <div class="card">
                    <h3>Want to publish?</h3>
                    <p>Please login to your author account to start writing.</p>
                    <button class="btn" onclick="go('prof')">Go to Login</button>
                </div>
            </div>
        </div>

        <div id="p-prof" class="page">
            <h1>Account Settings</h1>
            <div id="auth-ui" class="card">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="pass" placeholder="Password">
                <button class="btn" onclick="auth('login')">Sign In</button>
                <button class="btn" style="background:none; color:var(--p); margin-top:10px;" onclick="auth('signup')">Create Author Account</button>
            </div>
            <div id="user-ui" style="display:none" class="card">
                <p>Welcome back,</p>
                <h3 id="u-email" style="margin: 0 0 20px 0"></h3>
                <button class="btn" style="background:#ef4444" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </div>

    <div id="reader">
        <div class="reader-header">
            <button onclick="closeReader()" style="border:none; background:none; font-weight:800; font-size:16px; cursor:pointer;">← Back to Stories</button>
        </div>
        <div class="reader-content">
            <h1 id="r-title" style="margin-top:0"></h1>
            <div id="r-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = 'https://brsjluzuqfhslhszxtjh.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyc2psdXp1cWZoc2xoc3p4dGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NjA5NTgsImV4cCI6MjA5NDEzNjk1OH0.Oxsyga8BnkZv54BSsUOzYLiFOcNVxpFaKLwrHVRqunk';
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);
        let me = null;

        function go(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            document.querySelectorAll('.nav-links button').forEach(n => n.classList.remove('active'));
            document.getElementById('n-' + id).classList.add('active');
            window.scrollTo(0,0);
            if(id === 'home') loadFeed();
        }

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if(user) {
                me = user;
                document.getElementById('auth-ui').style.display = 'none';
                document.getElementById('user-ui').style.display = 'block';
                document.getElementById('u-email').innerText = me.email;
                setupWriter();
            }
            loadFeed();
        }

        async function loadFeed() {
            const { data } = await supabase.from('stories').select('*').order('created_at', {ascending:false});
            const feed = document.getElementById('feed');
            if(!data || data.length === 0) { feed.innerHTML = "No stories published yet."; return; }
            feed.innerHTML = "";
            data.forEach(s => {
                const c = document.createElement('div');
                c.className = 'card';
                c.innerHTML = `<h3 style="margin:0">${s.title}</h3><p style="color:var(--p); font-weight:700; margin:10px 0 0 0; cursor:pointer">Read Story →</p>`;
                c.onclick = () => {
                    document.getElementById('r-title').innerText = s.title;
                    document.getElementById('r-body').innerHTML = s.body.replace(/\n/g, '<br><br>');
                    document.getElementById('reader').style.display = 'flex';
                };
                feed.appendChild(c);
            });
        }

        function closeReader() { document.getElementById('reader').style.display = 'none'; }

        function setupWriter() {
            document.getElementById('writer-ui').innerHTML = `
                <div class="card">
                    <h3>Publish a New Chapter</h3>
                    <input id="w-t" placeholder="Chapter Title">
                    <textarea id="w-b" rows="15" placeholder="Write your masterpiece here..."></textarea>
                    <button class="btn" onclick="pub()">Publish Now</button>
                </div>`;
        }

        async function auth(type) {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            const { error } = (type === 'login') ? await supabase.auth.signInWithPassword({email:e, password:p}) : await supabase.auth.signUp({email:e, password:p});
            if(error) alert(error.message); else location.reload();
        }

        async function pub() {
            const t = document.getElementById('w-t').value, b = document.getElementById('w-b').value;
            const { error } = await supabase.from('stories').insert([{title:t, body:b, author_id:me.id}]);
            if(error) alert(error.message); else { alert("Story Published!"); go('home'); }
        }

        async function logout() { await supabase.auth.signOut(); location.reload(); }

        init();
    </script>
</body>
    </html>
