<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wnovels | Global Web Novel Terminal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5500">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        :root {
            --terminal-bg: #050508;
            --terminal-card: #0c0c14;
            --brand-primary: #ff5500;
            --brand-glow: rgba(255, 85, 0, 0.2);
            --text-main: #f1f1f6;
            --text-muted: #8e8e9f;
            --border-line: #1c1c30;
            --ui-font: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: var(--ui-font); -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--terminal-bg); color: var(--text-main);
            min-height: 100vh; padding-bottom: 60px;
        }

        .terminal-header {
            width: 100%; border-bottom: 1px solid var(--border-line);
            background-color: rgba(5, 5, 8, 0.9); backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 999;
        }
        .header-container {
            max-width: 1200px; margin: 0 auto; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand-logo-node {
            font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ff5500, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .btn-studio-shortcut {
            background: linear-gradient(90deg, #ff5500, #ff7700);
            color: white; border: none; padding: 10px 20px; border-radius: 12px;
            font-weight: 700; font-size: 14px; cursor: pointer; display: flex;
            align-items: center; gap: 8px; box-shadow: 0 4px 15px var(--brand-glow);
            transition: transform 0.2s; text-decoration: none;
        }
        .btn-studio-shortcut:hover { transform: translateY(-1px); }

        .main-grid-canvas { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }

        .section-headline-block {
            display: flex; align-items: center; gap: 10px; margin-bottom: 20px; margin-top: 20px;
        }
        .section-headline-block .material-icons-round { color: var(--brand-primary); }
        .section-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }

        .novel-matrix-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px;
        }

        .novel-cyber-card {
            background-color: var(--terminal-card); border: 1px solid var(--border-line);
            border-radius: 20px; padding: 25px; display: flex; flex-direction: column;
            justify-content: space-between; min-height: 220px; cursor: pointer;
            transition: all 0.2s ease-in-out; position: relative; overflow: hidden;
        }
        .novel-cyber-card:hover {
            border-color: var(--brand-primary); transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 85, 0, 0.05);
        }

        .card-genre-badge {
            font-size: 11px; font-weight: 700; color: var(--brand-primary);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
        }
        .card-novel-title { font-size: 18px; font-weight: 800; line-height: 1.3; margin-bottom: 8px; color: #ffffff; }
        .card-synopsis-preview {
            font-size: 13px; color: var(--text-muted); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        .card-meta-stats-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(28,28,48,0.5);
            font-size: 12px; color: var(--text-muted);
        }
        .meta-stat-node { display: flex; align-items: center; gap: 4px; }

        .trending-rank-tag {
            position: absolute; top: 20px; right: 20px; background-color: rgba(255, 85, 0, 0.1);
            color: var(--brand-primary); font-weight: 800; font-size: 12px;
            padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255, 85, 0, 0.2);
        }

        .loading-signal-box {
            grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 60px 20px; color: var(--text-muted); gap: 10px;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="terminal-header">
        <div class="header-container">
            <div class="brand-logo-node" onclick="window.location.reload()">Wnovels</div>
            
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="btnDownloadApp" class="btn-studio-shortcut" style="background: transparent; border: 1px solid var(--brand-primary); color: var(--brand-primary); display: none;">
                    <span class="material-icons-round">file_download</span>
                    <span>Download App</span>
                </button>
                
                <a href="writer.html" class="btn-studio-shortcut">
                    <span class="material-icons-round">biotech</span>
                    <span>Creator Studio</span>
                </a>
            </div>
        </div>
    </header>

    <main class="main-grid-canvas">
        <div class="section-headline-block">
            <span class="material-icons-round">local_fire_department</span>
            <h2 class="section-title">Wnovels Global Trending</h2>
        </div>
        <div class="novel-matrix-grid" id="trendingNovelsGrid"></div>

        <hr style="border: 0; border-top: 1px solid var(--border-line); margin: 20px 0;">

        <div class="section-headline-block">
            <span class="material-icons-round">fiber_new</span>
            <h2 class="section-title">Fresh Release Nodes</h2>
        </div>
        <div class="novel-matrix-grid" id="newReleasesGrid"></div>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBelCPgA4ZE7pcFGPPp9191KPOdaSSoMc8",
            authDomain: "studio-8164628274-c414a.firebaseapp.com",
            databaseURL: "https://studio-8164628274-c414a-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "studio-8164628274-c414a",
            storageBucket: "studio-8164628274-c414a.firebasestorage.app",
            messagingSenderId: "327634019544",
            appId: "1:327634019544:web:e3e913c4f12ea1d54ce3ad"
        };

        firebase.initializeApp(firebaseConfig);
        const centralDbRef = firebase.database().ref('novels');

        document.addEventListener("DOMContentLoaded", function() {
            compileAndStreamRealtimeLibrary();
        });

        function compileAndStreamRealtimeLibrary() {
            centralDbRef.on('value', snapshot => {
                const trendingGrid = document.getElementById('trendingNovelsGrid');
                const newReleaseGrid = document.getElementById('newReleasesGrid');

                if(!snapshot.exists()) {
                    trendingGrid.innerHTML = `<div class="loading-signal-box">No novels deployed.</div>`;
                    newReleaseGrid.innerHTML = `<div class="loading-signal-box">No novels deployed.</div>`;
                    return;
                }

                let originalArrayData = [];
                snapshot.forEach(child => { originalArrayData.push(child.val()); });

                let trendingSortedList = [...originalArrayData].sort((a, b) => (b.views || 0) - (a.views || 0));
                let newReleasesSortedList = [...originalArrayData].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                renderMatrixDataToDOM(trendingSortedList, trendingGrid, true);
                renderMatrixDataToDOM(newReleasesSortedList, newReleaseGrid, false);
            });
        }

        function renderMatrixDataToDOM(dataList, targetContainer, isTrendingBlock) {
            targetContainer.innerHTML = ""; 
            const executionLimitList = dataList.slice(0, 8);

            executionLimitList.forEach((novel, loopIndex) => {
                const card = document.createElement('div');
                card.className = "novel-cyber-card";
                card.onclick = function() { window.location.href = `reader.html?id=${novel.id}`; };

                card.innerHTML = `
                    <div>
                        ${isTrendingBlock ? `<div class="trending-rank-tag">RANK #${loopIndex + 1}</div>` : ''}
                        <div class="card-genre-badge">${novel.genre || 'General'}</div>
                        <h3 class="card-novel-title">${novel.title}</h3>
                        <p class="card-synopsis-preview">${novel.synopsis || 'No overview recorded.'}</p>
                    </div>
                    <div class="card-meta-stats-row">
                        <div class="meta-stat-node">
                            <span class="material-icons-round" style="font-size:15px; color:var(--brand-primary)">visibility</span>
                            <span>${novel.views || 0} Reads</span>
                        </div>
                        <div class="meta-stat-node">
                            <span class="material-icons-round" style="font-size:15px; color:#ff3366">favorite</span>
                            <span>${novel.likes || 0} Likes</span>
                        </div>
                    </div>
                `;
                targetContainer.appendChild(card);
            });
        }

        // PWA DOWNLOAD SCRIPT
        let deferredPrompt;
        const downloadBtn = document.getElementById('btnDownloadApp');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            downloadBtn.style.display = 'flex';
        });

        downloadBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') { console.log('Wnovels App Installed'); }
                deferredPrompt = null; downloadBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
