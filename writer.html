                </div>

                <button class="btn-studio" style="background:var(--accent-green);" onclick="executeDeployChapterToNovelNode()">Publish Chapter Data Block</button>
            </div>
        </div>
            </div>
            <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBelCPgA4ZE7pcFGPPp9191KPOdaSSoMc8",
          authDomain: "studio-8164628274-c414a.firebaseapp.com",
          databaseURL: "https://studio-8164628274-c414a-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "studio-8164628274-c414a",
          storageBucket: "studio-8164628274-c414a.firebasestorage.app",
          messagingSenderId: "327634019544", appId: "1:327634019544:web:e3e913c4f12ea1d54ce3ad"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        let activeSelectedBookId = null;
        let globalCompressedCoverBase64 = "";
        let globalCompressedAvatarBase64 = "";

        // Automated Device Identity Verification Protocol
        auth.onAuthStateChanged(user => {
            if(!user) { 
                auth.signInAnonymously().catch(e => alert("Studio Node Fail: " + e.message)); 
            } else { 
                loadAuthorProfileIdentityNode(user.uid);
                fetchAndRenderAuthorNovelsStrip(); 
            }
        });

        // Advanced Base64 File Multi-Stream Compressor Engine
        function processLocalImageCompression(inputElement, previewId) {
            const file = inputElement.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    
                    // Smart Resizer Protocol to maintain light database payloads
                    let maxDim = previewId === 'avatarPreview' ? 120 : 320;
                    let w = img.width; let h = img.height;
                    if(w > h) { if(w > maxDim) { h *= maxDim / w; w = maxDim; } }
                    else { if(h > maxDim) { w *= maxDim / h; h = maxDim; } }
                    
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    // Compress stream matrix to JPEG data node
                    let compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    const previewImg = document.getElementById(previewId);
                    previewImg.src = compressedDataUrl; previewImg.style.display = "block";
                    
                    if(previewId === 'coverPreview') globalCompressedCoverBase64 = compressedDataUrl;
                    if(previewId === 'avatarPreview') globalCompressedAvatarBase64 = compressedDataUrl;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Author Profile Node Sync
        function loadAuthorProfileIdentityNode(uid) {
            database.ref('authors/' + uid).once('value').then(s => {
                if(s.exists()) {
                    let d = s.val(); document.getElementById('authorStudioPenName').value = d.penName || "";
                    if(d.avatar) {
                        let av = document.getElementById('avatarPreview');
                        av.src = d.avatar; av.style.display = "block"; globalCompressedAvatarBase64 = d.avatar;
                    }
                }
            });
        }

        function executeSaveAuthorProfileNode() {
            let uid = auth.currentUser ? auth.currentUser.uid : null; if(!uid) return;
            let name = document.getElementById('authorStudioPenName').value.trim();
            if(!name) return alert("Pen Name cannot be empty.");
            
            database.ref('authors/' + uid).set({ penName: name, avatar: globalCompressedAvatarBase64, timestamp: Date.now() })
            .then(() => alert("Author Profile Node Synced Successfully!"))
            .catch(e => alert("Profile Sync Error: " + e.message));
        }

        // Expanded Novel Registration Engine
        function executeCreateNovelDatabaseNode() {
            let title = document.getElementById('newNovelTitle').value.trim();
            let genre = document.getElementById('newNovelGenre').value;
            let audience = document.getElementById('newNovelAudience').value;
            let syno = document.getElementById('newNovelSynopsis').value.trim();
            let uid = auth.currentUser ? auth.currentUser.uid : null;

            if(!title || !syno) return alert("Title and Synopsis text channels must be populated.");
            if(!globalCompressedCoverBase64) return alert("Please select or upload a Cover Image from your Gallery/Files.");

            database.ref('authors/' + uid).once('value').then(authorSnap => {
                let authorName = "Independent Author";
                if(authorSnap.exists()) authorName = authorSnap.val().penName || "Independent Author";

                let targetNode = database.ref('novels').push();
                targetNode.set({
                    title: title, authorName: authorName, authorUid: uid, genre: genre,
                    coverUrl: globalCompressedCoverBase64, synopsis: syno, audienceRating: audience,
                    totalViews: 0, totalCoinRevenueEarned: 0, status: "ongoing", timestamp: Date.now()
                }).then(() => {
                    alert(`SUCCESS: "${title}" has been registered safely via local gallery file streams!`);
                    document.getElementById('newNovelTitle').value = ""; document.getElementById('newNovelSynopsis').value = "";
                    document.getElementById('coverPreview').style.display = "none"; globalCompressedCoverBase64 = "";
                }).catch(err => alert("Transmission Error: " + err.message));
            });
        }

        function fetchAndRenderAuthorNovelsStrip() {
            database.ref('novels').on('value', snap => {
                const strip = document.getElementById('authorNovelsStripContainer'); strip.innerHTML = "";
                if(!snap.exists()) { strip.innerHTML = "<div style='color:var(--text-muted); font-size:0.75rem;'>No active books found. Deploy one above.</div>"; return; }
                
                snap.forEach(c => {
                    let b = c.val(); let bId = c.key;
                    let isActive = (bId === activeSelectedBookId) ? "active" : "";
                    strip.innerHTML += `
                        <div class="novel-strip-card ${isActive}" onclick="selectActiveNovelNodeContext('${bId}')">
                            <div style="font-weight:bold; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${b.title}</div>
                            <div style="font-size:0.65rem; color:var(--accent-gold); margin-top:4px;">👁️ ${b.totalViews || 0} views</div>
                        </div>`;
                });
            });
        }

        function selectActiveNovelNodeContext(bookId) {
            activeSelectedBookId = bookId;
            document.getElementById('activeTargetBookIdLabel').innerText = bookId;
            document.getElementById('chapterWriteBoxInputsContainer').style.display = "block";
            
            document.querySelectorAll('.novel-strip-card').forEach(c => c.classList.remove('active'));
            fetchAndRenderAuthorNovelsStrip();
        }

        function executeDeployChapterToNovelNode() {
            if(!activeSelectedBookId) return alert("Select an active novel destination target node.");
            let chNum = parseInt(document.getElementById('newChapterNumber').value);
            let chTitle = document.getElementById('newChapterTitle').value.trim();
            let cost = parseInt(document.getElementById('newChapterCoinCost').value) || 0;
            let content = document.getElementById('newChapterContent').value.trim();

            if(isNaN(chNum) || !chTitle || !content) return alert("Chapter metadata validation failed. Ensure text streams are full.");

            let targetChapterNode = database.ref(`novels/${activeSelectedBookId}/chapters`).push();
            targetChapterNode.set({
                chapterNum: chNum, chapterTitle: chTitle, coinCost: cost, content: content, timestamp: Date.now()
            }).then(() => {
                alert(`SUCCESS: Chapter ${chNum} published successfully to the core network!`);
                document.getElementById('newChapterNumber').value = chNum + 1;
                document.getElementById('newChapterTitle').value = ""; document.getElementById('newChapterContent').value = "";
            }).catch(e => alert("Failed to append chapter block: " + e.message));
        }
    </script>
</body>
</html>
