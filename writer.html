<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WNOVELS STUDIO - Author Blueprint Dashboard</title>
    
    <script src="https://pl29471258.effectivecpmnetwork.com/27/7b/f8/277bf845b91c531ad9fb066482ac8cae.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-deep: #04060e;
            --bg-surface: #0b0f1e;
            --accent-orange: #ff4500;
            --text-main: #f1f5f9;
            --text-muted: #475569;
            --border: #1e293b;
            --studio-purple: #6366f1;
        }
        body {
            background-color: var(--bg-deep); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 20px; padding-bottom: 80px;
        }
        .studio-header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .studio-headline { font-size: 1.3rem; font-weight: 900; color: var(--studio-purple); text-transform: uppercase; letter-spacing: 1px; }
        
        .form-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .field-group { margin-bottom: 15px; }
        label { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 5px; font-weight: bold; }
        
        .input-box, select, textarea {
            width: 100%; background: #04060e; border: 1px solid var(--border);
            border-radius: 8px; padding: 12px; color: white; font-size: 0.9rem; box-sizing: border-box;
        }
        textarea { height: 100px; resize: none; }
        
        .cover-preview-box {
            border: 2px dashed var(--border); border-radius: 10px; width: 110px; height: 160px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-size: 0.7rem; color: var(--text-muted); cursor: pointer; object-fit: cover; background: #020307;
        }
        
        .btn-deploy {
            background: linear-gradient(90deg, var(--studio-purple), #4f46e5);
            color: white; border: none; font-weight: bold; text-transform: uppercase;
            width: 100%; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; letter-spacing: 0.5px;
        }
        .btn-deploy:active { opacity: 0.8; }
        .back-hud-btn { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; display: block; text-align: center; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="studio-header">
    <div class="studio-headline">🎨 WNovels Author Studio</div>
    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 3px;">Deploy and Update Creative Blueprints on Global Server</div>
</div>

<div class="form-card">
    <div style="font-size: 0.95rem; font-weight: bold; margin-bottom: 15px; color: var(--text-main);">➕ Create New Novel Blueprint</div>
    
    <div class="field-group">
        <label>Manuscript Cover Canvas</label>
        <input type="file" id="coverFileInput" style="display: none;" accept="image/*" onchange="convertCoverToCloudPayload()">
        <img id="coverPreviewCanvas" class="cover-preview-box" src="https://via.placeholder.com/110x160?text=Upload+Cover" onclick="triggerCoverInputClick()">
    </div>

    <div class="field-group">
        <label>Novel Identity Title</label>
        <input type="text" id="novelTitleInput" class="input-box" placeholder="e.g. The Sovereign System Overlord">
    </div>

    <div class="field-group">
        <label>Author Alias Penname</label>
        <input type="text" id="novelAuthorInput" class="input-box" placeholder="e.g. Author_Xeno">
    </div>

    <div class="field-group">
        <label>Genre Sorting Vector</label>
        <select id="novelGenreSelect">
            <option value="Fantasy System">Fantasy System</option>
            <option value="LitRPG / Isekai">LitRPG / Isekai</option>
            <option value="Martial Arts Cultivation">Martial Arts Cultivation</option>
            <option value="Romance / Urban">Romance / Urban</option>
        </select>
    </div>

    <div class="field-group">
        <label>Ecosystem Synopsis Summary</label>
        <textarea id="novelSynopsisInput" placeholder="Write a short dramatic hooked synopsis sequence..."></textarea>
    </div>

    <button class="btn-deploy" onclick="deployNovelManuscriptToCloud()">Deploy Blueprint to Feed</button>
</div>

<div class="back-hud-btn" onclick="location.href='index.html'">← Leave Studio & Return to Central Library</div>
<script>
    // 🔑 SECURED RECOGNIZED FIREBASE DATABASE ENGINE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBelCPgA4ZE7pcFGPPp9191KPOdaSSoMc8",
      authDomain: "studio-8164628274-c414a.firebaseapp.com",
      databaseURL: "https://studio-8164628274-c414a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "studio-8164628274-c414a",
      storageBucket: "studio-8164628274-c414a.firebasestorage.app",
      messagingSenderId: "327634019544",
      appId: "1:327634019544:web:e3e913c4f12ea1d54ce3ad"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    let base64CoverPayload = "https://via.placeholder.com/110x160?text=No+Cover";
    const adsterraDirectLink = "https://pl29471258.effectivecpmnetwork.com/27/7b/f8/277bf845b91c531ad9fb066482ac8cae.js";

    function triggerCoverInputClick() { document.getElementById('coverFileInput').click(); }

    function convertCoverToCloudPayload() {
        const file = document.getElementById('coverFileInput').files[0];
        const reader = new FileReader();
        reader.onloadend = function() {
            base64CoverPayload = reader.result;
            document.getElementById('coverPreviewCanvas').src = base64CoverPayload;
        }
        if(file) reader.readAsDataURL(file);
    }

    function deployNovelManuscriptToCloud() {
        let title = document.getElementById('novelTitleInput').value.trim();
        let author = document.getElementById('novelAuthorInput').value.trim();
        let genre = document.getElementById('novelGenreSelect').value;
        let synopsis = document.getElementById('novelSynopsisInput').value.trim();

        if(!title || !author || !synopsis) {
            return alert("⚠️ All mandatory fields must be validated before blueprint deployment!");
        }

        // Automatic Ad Activation Gate to generate revenue
        window.open(adsterraDirectLink, '_blank');

        let contentNodeRef = database.ref('novels').push();
        contentNodeRef.set({
            title: title,
            authorName: author,
            genre: genre,
            synopsis: synopsis,
            coverUrl: base64CoverPayload,
            totalViews: 0,
            totalLikes: 0,
            totalComments: 0,
            timestamp: Date.now() // Critical node factor for "Newly Released / New Chapters" sorter
        }).then(() => {
            alert("🚀 System blueprint successfully compiled and broadcasted to global library feed!");
            
            document.getElementById('novelTitleInput').value = "";
            document.getElementById('novelAuthorInput').value = "";
            document.getElementById('novelSynopsisInput').value = "";
            document.getElementById('coverPreviewCanvas').src = "https://via.placeholder.com/110x160?text=Upload+Cover";
            base64CoverPayload = "https://via.placeholder.com/110x160?text=No+Cover";
        });
    }
</script>
</body>
</html>
